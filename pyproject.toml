[project]
name = "uedev-cli"
version = "0.1.0"
description = "A Python UE development agent CLI for coding and automation workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "prompt_toolkit>=3.0",
]
keywords = ["agent", "cli", "automation", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
uedev = "uedev.cli:main"

[tool.setuptools]
packages = ["uedev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
